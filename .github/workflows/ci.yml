name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # `npm test` runs .ts files directly and passes a quoted glob to `node --test`,
      # which needs Node 22.6+ (Node 20 fails with "Could not find src/**/*.test.ts").
      # Node 24 is what the tests are verified on. Next.js 16 itself needs >= 20.9.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      # `npm run lint` (next lint) is intentionally not run: Next 16 removed the
      # `next lint` command and there is no ESLint 9 flat config (only .eslintrc.json).
      # Add an eslint.config.mjs and `eslint .` here when ready.

      # The build calls the public production API at build time (sitemaps and
      # server-rendered data); only a public, read-only URL is used, no secrets.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api-aggiesbp.nitheeshk.com
